<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg-1:#fff3f5;
    --bg-2:#ffdce6;
    --bg-3:#ffc4d6;
    --rose:#ff6f91;
    --rose-deep:#e2547a;
    --rose-gold:#f6b9c6;
    --plum:#6b2545;
    --muted:#b98a9c;
    --branch:#8a5a46;
    --cream:#fffaf8;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    height:100dvh;
    width:100%;
    overflow:hidden;
    overscroll-behavior:none;
    font-family:'Manrope',sans-serif;
    color:var(--plum);
    background:var(--bg-1);
  }

  #stage{
    position:relative;
    width:100%;
    height:100%;
    background:
      radial-gradient(ellipse at 50% 0%, #ffffff 0%, var(--bg-1) 38%, var(--bg-2) 75%, var(--bg-3) 100%);
    touch-action:manipulation;
    -webkit-touch-callout:none;
    overflow:hidden;
  }

  canvas#petals{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.8s ease;
  }
  .scene.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- Scene 1: postcard ---------- */

  .card{
    position:relative;
    width:min(440px, 92vw);
    max-height:82vh;
    overflow-y:auto;
    background:var(--cream);
    border-radius:18px;
    padding:40px 32px 34px;
    box-shadow:0 24px 60px rgba(178,90,120,0.28), 0 2px 8px rgba(178,90,120,0.12);
    text-align:center;
  }
  .card::-webkit-scrollbar{width:5px;}
  .card::-webkit-scrollbar-thumb{background:var(--rose-gold); border-radius:3px;}

  .sprig{
    width:86px;
    height:auto;
    margin:0 auto 14px;
    display:block;
    animation:sway 4.5s ease-in-out infinite;
    transform-origin:50% 100%;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-2.5deg); }
    50%{ transform:rotate(2.5deg); }
  }

  .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:var(--muted);
    letter-spacing:0.04em;
    margin-bottom:16px;
  }

  .card-lines p{
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    line-height:1.7;
    color:var(--plum);
    margin-bottom:12px;
    opacity:0;
    transform:translateY(8px);
    animation:riseIn 0.7s ease forwards;
  }
  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .next-btn{
    margin-top:18px;
    background:transparent;
    border:1px solid var(--rose);
    color:var(--rose-deep);
    font-family:'Manrope',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:12px 30px;
    border-radius:30px;
    cursor:pointer;
    outline:none;
    letter-spacing:0.03em;
    opacity:0;
    transition:background 0.2s ease, transform 0.15s ease, opacity 0.5s ease;
  }
  .next-btn.show{ opacity:1; }
  .next-btn:hover{ background:rgba(255,111,145,0.1); transform:translateY(-2px); }
  .next-btn:active{ transform:scale(0.97); }

  /* ---------- Scene 2: proposal ---------- */

  .ask-eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:16px;
    color:var(--muted);
    margin-bottom:10px;
  }

  .ask-question{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(24px,5.5vw,36px);
    color:var(--plum);
    text-align:center;
    max-width:520px;
    margin-bottom:8px;
  }

  .branch-hint{
    font-family:'Manrope',sans-serif;
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.05em;
    margin-bottom:6px;
  }

  .branch-wrap{
    width:min(300px, 78vw);
    cursor:pointer;
    margin:14px 0 6px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .branch-wrap.tapped{
    animation:none;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.035); }
  }

  .bud .flower{
    opacity:0;
    transform:scale(0.2);
    transform-box:fill-box;
    transform-origin:center;
    transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.3,1.4,.5,1);
  }
  .bud .stem-dot{
    transition:opacity 0.4s ease;
  }
  .branch.bloomed .bud .flower{
    opacity:1;
    transform:scale(1);
  }
  .branch.bloomed .bud .stem-dot{
    opacity:0;
  }
  .branch.bloomed .bud:nth-of-type(1) .flower{ transition-delay:0s; }
  .branch.bloomed .bud:nth-of-type(2) .flower{ transition-delay:0.12s; }
  .branch.bloomed .bud:nth-of-type(3) .flower{ transition-delay:0.24s; }
  .branch.bloomed .bud:nth-of-type(4) .flower{ transition-delay:0.36s; }
  .branch.bloomed .bud:nth-of-type(5) .flower{ transition-delay:0.48s; }
  .branch.bloomed .bud:nth-of-type(6) .flower{ transition-delay:0.6s; }

  .finale{
    position:absolute;
    left:50%;
    bottom:9%;
    transform:translateX(-50%) translateY(14px);
    width:min(420px, 88vw);
    background:rgba(255,250,248,0.92);
    backdrop-filter:blur(4px);
    border-radius:16px;
    padding:22px 24px;
    text-align:center;
    box-shadow:0 18px 46px rgba(178,90,120,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .finale.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }
  .finale h1{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(20px,4.4vw,26px);
    color:var(--rose-deep);
    margin-bottom:8px;
  }
  .finale p{
    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    color:var(--plum);
    line-height:1.55;
  }

  @media (max-width:480px){
    .card{ padding:32px 24px 28px; }
    .card-lines p{ font-size:18px; }
    .sprig{ width:72px; }
    .branch-wrap{ width:74vw; }
    .finale{ padding:18px 20px; bottom:7%; }
  }

  @media (max-height:620px){
    .card{ max-height:88vh; padding:26px 22px; }
    .sprig{ width:60px; margin-bottom:8px; }
    .branch-wrap{ margin:8px 0 4px; }
  }

</style>
</head>
<body>

<div id="stage">
  <canvas id="petals"></canvas>

  <!-- Scene 1: postcard -->
  <div class="scene active" id="scene-card">
    <div class="card">
      <svg class="sprig" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 68 C48 50, 40 40, 20 28" stroke="#8a5a46" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M50 68 C52 48, 62 36, 82 22" stroke="#8a5a46" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M50 68 C50 44, 50 30, 50 8" stroke="#8a5a46" stroke-width="2" fill="none" stroke-linecap="round"/>
        <g id="sprigFlowers"></g>
      </svg>
      <p class="eyebrow">Небольшое письмо</p>
      <div class="card-lines" id="cardLines"></div>
      <button class="next-btn" id="nextBtn">Читать дальше →</button>
    </div>
  </div>

  <!-- Scene 2: the ask -->
  <div class="scene" id="scene-ask">
    <p class="ask-eyebrow" id="askEyebrow">Пока падают лепестки...</p>
    <h1 class="ask-question" id="askQuestion">Слушай... а что если нам попробовать быть вместе?</h1>
    <div class="branch-wrap" id="branchWrap">
      <svg class="branch" id="branchSvg" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 140 C 60 120, 70 100, 90 80 C 110 60, 130 55, 160 40 C 185 28, 200 20, 220 8"
              stroke="#8a5a46" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M100 76 C 95 60, 88 50, 70 40" stroke="#8a5a46" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M150 44 C 155 30, 150 18, 140 8" stroke="#8a5a46" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <g id="branchBuds"></g>
      </svg>
    </div>
    <p class="branch-hint" id="branchHint">нажми на веточку</p>

    <div class="finale" id="finale">
      <h1 id="finaleTitle">Пусть расцветёт что-то красивое</h1>
      <p id="finaleText">Это просто маленький намёк. А по-настоящему я спрошу тебя при встрече 🌸</p>
    </div>
  </div>
</div>

<script>
// ---------- Editable content ----------
const CARD_LINES = [
  "Не знаю, с чего начать,",
  "но в последние дни всё вокруг как будто расцвело чуть ярче.",
  "Хочу, чтобы ты знала: рядом с тобой очень тепло.",
  "Спасибо, что ты появилась — пусть и совсем недавно."
];
const ASK_QUESTION = "Слушай... а что если нам попробовать быть вместе?";
const FINALE_TITLE = "Пусть расцветёт что-то красивое";
const FINALE_TEXT = "Это просто маленький намёк. А по-настоящему я спрошу тебя при встрече 🌸";

// ---------- Petal canvas ----------
const canvas = document.getElementById('petals');
const ctx = canvas.getContext('2d');
let W,H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
const PETAL_COLORS = ['#ffb6c9','#ff8fab','#ffd6e2','#f7a8bf'];

let petals = [];
function makePetal(x,y,burst){
  return {
    x: x!==undefined ? x : rand(0,W),
    y: y!==undefined ? y : rand(-40,-4),
    size: rand(6,11),
    rot: rand(0,Math.PI*2),
    rotSpeed: rand(-0.02,0.02),
    swayAmp: rand(18,42),
    swayFreq: rand(0.006,0.016),
    phase: rand(0,Math.PI*2),
    speed: rand(0.5,1.3),
    vx: burst ? rand(-2.2,2.2) : 0,
    vy: burst ? rand(-3,-0.5) : 0,
    color: pick(PETAL_COLORS),
    alpha: rand(0.7,1),
    t:0
  };
}
for(let i=0;i<46;i++){ petals.push(makePetal(undefined, rand(0,H))); }

function drawPetal(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.rot);
  ctx.scale(p.size/8,p.size/8);
  ctx.beginPath();
  ctx.moveTo(0,-4);
  ctx.bezierCurveTo(3,-3, 4,0, 0,5);
  ctx.bezierCurveTo(-4,0, -3,-3, 0,-4);
  ctx.closePath();
  ctx.fillStyle = p.color;
  ctx.globalAlpha = p.alpha;
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function burstPetals(x,y,count){
  for(let i=0;i<count;i++){
    petals.push(makePetal(x + rand(-20,20), y + rand(-10,10), true));
  }
}

function tick(){
  ctx.clearRect(0,0,W,H);
  for(let i=petals.length-1;i>=0;i--){
    const p = petals[i];
    p.t += 1;
    p.rot += p.rotSpeed;
    if(p.vy !== 0 || p.vx !== 0){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.98;
    } else {
      p.y += p.speed;
      p.x += Math.sin(p.t*p.swayFreq + p.phase) * (p.swayAmp*0.02);
    }
    drawPetal(p);
    if(p.y > H+20){
      if(petals.length > 260){ petals.splice(i,1); }
      else { petals[i] = makePetal(undefined, -20); }
    }
    if(p.x < -30 || p.x > W+30){
      if(petals.length > 260){ petals.splice(i,1); }
    }
  }
  requestAnimationFrame(tick);
}
tick();

// ---------- Flower SVG builder ----------
function buildFlower(cx, cy, scaleFactor){
  const s = scaleFactor || 1;
  const petalColor = '#ff9db5';
  let petalsSvg = '';
  for(let i=0;i<5;i++){
    const angle = (Math.PI*2*i)/5;
    const px = cx + Math.cos(angle)*3.6*s;
    const py = cy + Math.sin(angle)*3.6*s;
    petalsSvg += `<ellipse cx="${px}" cy="${py}" rx="${3.2*s}" ry="${4.6*s}" fill="${petalColor}" transform="rotate(${(angle*180/Math.PI)+90} ${px} ${py})"/>`;
  }
  return `<g class="flower">${petalsSvg}<circle cx="${cx}" cy="${cy}" r="${1.6*s}" fill="#ffd166"/></g>`;
}

function addBud(container, cx, cy, scaleFactor){
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','bud');
  g.innerHTML = `<circle class="stem-dot" cx="${cx}" cy="${cy}" r="${2.6*(scaleFactor||1)}" fill="#8a5a46"/>` + buildFlower(cx,cy,scaleFactor);
  container.appendChild(g);
}

// small static bloomed sprig on the postcard (scene 1)
const sprigG = document.getElementById('sprigFlowers');
[[20,28],[82,22],[50,8],[35,18],[65,15]].forEach(([x,y])=>{
  sprigG.innerHTML += buildFlower(x,y,0.85);
});

// interactive bare branch on scene 2
const branchBuds = document.getElementById('branchBuds');
const budPositions = [[90,80],[70,40],[160,40],[140,8],[220,8],[185,28]];
budPositions.forEach(([x,y])=> addBud(branchBuds, x, y, 1));

// ---------- Scene navigation ----------
function typeCard(){
  const el = document.getElementById('cardLines');
  el.innerHTML = '';
  CARD_LINES.forEach((line, idx)=>{
    const p = document.createElement('p');
    p.textContent = line;
    p.style.animationDelay = (idx*0.5)+'s';
    el.appendChild(p);
  });
  const btn = document.getElementById('nextBtn');
  btn.classList.remove('show');
  setTimeout(()=> btn.classList.add('show'), (CARD_LINES.length*0.5 + 0.4)*1000);
}
typeCard();

document.getElementById('nextBtn').addEventListener('click', ()=>{
  document.getElementById('scene-card').classList.remove('active');
  document.getElementById('scene-ask').classList.add('active');
  document.getElementById('askQuestion').textContent = ASK_QUESTION;
});

// ---------- Branch tap → bloom ----------
const branchWrap = document.getElementById('branchWrap');
const branchSvg = document.getElementById('branchSvg');
const branchHint = document.getElementById('branchHint');
let bloomed = false;

branchWrap.addEventListener('click', ()=>{
  if(bloomed) return;
  bloomed = true;
  branchWrap.classList.add('tapped');
  branchSvg.classList.add('bloomed');
  branchHint.style.transition = 'opacity 0.5s ease';
  branchHint.style.opacity = '0';

  const rect = branchWrap.getBoundingClientRect();
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      burstPetals(rect.left + rect.width*rand(0.25,0.75), rect.top + rect.height*rand(0.18,0.72), 90);
    }, i*120);
  }

  setTimeout(()=>{
    document.getElementById('finaleTitle').textContent = FINALE_TITLE;
    document.getElementById('finaleText').textContent = FINALE_TEXT;
    document.getElementById('finale').classList.add('show');
  }, 1400);
});
</script>
</body>
</html>
